services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tesla_companion
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: tesla_companion
    volumes:
      - postgres-data:/var/lib/postgresql/data

  # Signs vehicle commands with the Vehicle Command private key. Deliberately
  # has no `ports:` mapping — it's only reachable by `backend` over the
  # internal Docker network, never exposed to the host or the internet.
  tesla-proxy:
    build:
      context: .
      dockerfile: tesla-http-proxy.Dockerfile
    restart: unless-stopped
    command:
      - -tls-key
      - /keys/proxy-tls.key
      - -cert
      - /keys/proxy-tls.crt
      - -key-file
      - /keys/private-key.pem
      - -port
      - "4443"
    volumes:
      - ../backend/keys:/keys:ro

  # TLS termination is handled by your existing Nginx Proxy Manager
  # instance, not by anything in this compose file — point an NPM Proxy
  # Host at <NAS LAN IP>:3000 (see deploy/README.md). Published on the
  # host's LAN interface, not forwarded through the router, so it isn't
  # reachable from the internet directly — only via NPM's 80/443.
  backend:
    build:
      context: ../backend
    restart: unless-stopped
    env_file: .env
    ports:
      - "3000:3000"
    volumes:
      - ../backend/keys:/app/keys:ro
    depends_on:
      - postgres
      - tesla-proxy

volumes:
  postgres-data:
