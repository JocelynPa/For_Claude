services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tesla_companion
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: tesla_companion
    volumes:
      - postgres-data:/var/lib/postgresql/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      default: {}
      macvlan_lan:
        ipv4_address: ${POSTGRES_STATIC_IP:?Set POSTGRES_STATIC_IP in deploy/.env}

  # Signs vehicle commands with the Vehicle Command private key. Previously
  # had no LAN presence at all — now also on macvlan_lan at your request,
  # which means it's reachable by any device on the local network, not just
  # `backend`. Restrict access at your LAN/firewall level if you want to
  # preserve the original "only backend can reach it" guarantee.
  tesla-proxy:
    build:
      context: .
      dockerfile: tesla-http-proxy.Dockerfile
    restart: unless-stopped
    command:
      - -host
      - 0.0.0.0
      - -tls-key
      - /keys/proxy-tls.key
      - -cert
      - /keys/proxy-tls.crt
      - -key-file
      - /keys/private-key.pem
      - -port
      - "4443"
      - -verbose
    volumes:
      - ../backend/keys:/keys:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      default: {}
      macvlan_lan:
        ipv4_address: ${TESLA_PROXY_STATIC_IP:?Set TESLA_PROXY_STATIC_IP in deploy/.env}

  # TLS termination is handled by your existing Nginx Proxy Manager
  # instance, not by anything in this compose file — point an NPM Proxy
  # Host at ${BACKEND_STATIC_IP}:3000 (see deploy/README.md).
  #
  # Attached to both `default` (so it can still reach postgres/tesla-proxy
  # by service name over the normal Docker network) and the macvlan network
  # with a fixed LAN IP. No `ports:` mapping — the macvlan IP replaces it.
  backend:
    build:
      context: ../backend
    restart: unless-stopped
    env_file: .env
    volumes:
      - ../backend/keys:/app/keys:ro
      # Read-only access to the Fleet Telemetry cert, only needed to fill in
      # the "ca" field when subscribing a vehicle (POST
      # /vehicles/:id/telemetry/subscribe) — see FLEET_TELEMETRY_CA_FILE.
      - certbot-certs:/etc/letsencrypt:ro
    depends_on:
      - postgres
      - tesla-proxy
      - redis
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      default: {}
      macvlan_lan:
        ipv4_address: ${BACKEND_STATIC_IP:?Set BACKEND_STATIC_IP in deploy/.env}

  # Pub/Sub bus between fleet-telemetry and the backend's ingestor — purely
  # internal, no LAN/macvlan presence needed.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # One-shot certificate issuance for fleet-telemetry's own mTLS listener,
  # via DNS-01 (Route 53) — doesn't need port 80 and works on its own
  # subdomain independently of NPM. Not started by `docker compose up`
  # (no restart policy); run manually, see deploy/README.md.
  certbot:
    image: certbot/dns-route53
    volumes:
      - certbot-certs:/etc/letsencrypt
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?Set AWS_ACCESS_KEY_ID in deploy/.env}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?Set AWS_SECRET_ACCESS_KEY in deploy/.env}
    entrypoint: >
      certbot certonly
      --dns-route53
      --non-interactive --agree-tos
      --email ${LETSENCRYPT_EMAIL:?Set LETSENCRYPT_EMAIL in deploy/.env}
      -d ${FLEET_TELEMETRY_HOSTNAME:?Set FLEET_TELEMETRY_HOSTNAME in deploy/.env}

  # Tesla's official Fleet Telemetry reference server: vehicles stream
  # SentryMode state directly to it (mTLS, vehicle-initiated). Terminates
  # TLS itself — can't go through NPM like `backend` does, mTLS client-cert
  # validation requires the raw TLS handshake to reach this process
  # directly. Needs its own LAN IP + a router port-forward (see
  # deploy/README.md), unlike tesla-proxy/postgres which only got macvlan
  # IPs for LAN convenience.
  fleet-telemetry:
    image: tesla/fleet-telemetry:latest
    restart: unless-stopped
    # The official image has no baked-in ENTRYPOINT (unlike our own
    # tesla-http-proxy build) — the binary path must be the first element.
    command: ["/fleet-telemetry", "-config=/etc/fleet-telemetry/config.json"]
    volumes:
      - ./fleet-telemetry-config.json:/etc/fleet-telemetry/config.json:ro
      - certbot-certs:/etc/letsencrypt:ro
    depends_on:
      - redis
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      default: {}
      macvlan_lan:
        ipv4_address: ${FLEET_TELEMETRY_STATIC_IP:?Set FLEET_TELEMETRY_STATIC_IP in deploy/.env}

volumes:
  postgres-data:
  certbot-certs:

networks:
  # References a macvlan network already created on the NAS (its exact
  # subnet/parent-interface config lives there, not here) — not created by
  # this compose file. `docker network ls` on the NAS to confirm its name.
  macvlan_lan:
    external: true
    name: ${MACVLAN_NETWORK_NAME:?Set MACVLAN_NETWORK_NAME in deploy/.env}
