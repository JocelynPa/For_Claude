name: TeslaCompanion
options:
  bundleIdPrefix: com.teslacompanion
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  TeslaCompanion:
    type: application
    platform: iOS
    sources:
      - path: TeslaCompanion
    info:
      path: TeslaCompanion/Resources/Info.plist
      properties:
        CFBundleDisplayName: Tesla Companion
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        API_BASE_URL: https://api.teslacompanion.app
        CFBundleURLTypes:
          - CFBundleURLName: com.teslacompanion.oauth
            CFBundleURLSchemes:
              - teslacompanion
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.teslacompanion.app
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: false
schemes:
  TeslaCompanion:
    build:
      targets:
        TeslaCompanion: all
    run:
      config: Debug
    archive:
      config: Release
