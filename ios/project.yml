name: TeslaCompanion
options:
  bundleIdPrefix: com.teslacompanion
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  TeslaCompanion:
    type: application
    platform: iOS
    sources:
      - path: TeslaCompanion
    info:
      path: TeslaCompanion/Resources/Info.plist
      properties:
        CFBundleDisplayName: Sentinel Mode
        CFBundleIconName: AppIcon
        UILaunchScreen:
          UIColorName: LaunchBackground
        # Dark-only design (see TeslaCompanionApp) — set here too so the
        # status bar/launch screen already match before SwiftUI applies
        # .preferredColorScheme(.dark).
        UIUserInterfaceStyle: Dark
        ITSAppUsesNonExemptEncryption: false
        API_BASE_URL: https://grapple-battering-donation.ngrok-free.dev
        CFBundleURLTypes:
          - CFBundleURLName: com.teslacompanion.oauth
            CFBundleURLSchemes:
              - teslacompanion
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.teslacompanion.app
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      path: TeslaCompanion/TeslaCompanion.entitlements
      properties:
        # "development" for direct Xcode installs — switch to "production"
        # only once distributed via TestFlight/App Store, alongside
        # APNS_PRODUCTION=true. See deploy/README.md §12.
        aps-environment: development
        # Powers the current-weather chip on the Sentinel card (see
        # SentinelActivationCard/WeatherChip) — also needs the WeatherKit
        # capability enabled for this App ID in the Apple Developer portal.
        com.apple.developer.weatherkit: true
schemes:
  TeslaCompanion:
    build:
      targets:
        TeslaCompanion: all
    run:
      config: Debug
    archive:
      config: Release
